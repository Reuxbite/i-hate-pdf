name: Bug report
description: Report a reproducible problem without attaching private documents or secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach a private PDF, password, token, vault export, or other personal data. Use a synthetic file that reproduces the issue.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Desktop web
        - Android
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-test or commit hash
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Use a synthetic document and list the smallest exact sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private documents, passwords, tokens, vault exports, and personal data.
          required: true
