name: Feature request
description: Propose one focused addition or improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What PDF workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Desktop web
        - Android
        - Both
    validations:
      required: true
  - type: checkboxes
    id: local
    attributes:
      label: Local-first fit
      options:
        - label: This can work without silently uploading original documents.
          required: true
